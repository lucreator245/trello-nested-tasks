<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nested Tasks</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #172b4d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      padding: 12px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 20px;
    }

    #status {
      min-height: 18px;
      margin: 0 0 10px;
      color: #5e6c84;
      font-size: 13px;
      line-height: 18px;
    }

    #status.error {
      color: #ae2a19;
      font-weight: 600;
    }

    .progress {
      margin: 0 0 14px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #5e6c84;
      font-size: 13px;
      line-height: 18px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe1e6;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #0c66e4;
      transition: width 160ms ease, background-color 160ms ease;
    }

    .progress-fill.complete {
      background: #22a06b;
    }

    #tasks {
      width: 100%;
      min-width: 0;
    }

    .empty-state {
      margin: 8px 0 12px;
      color: #5e6c84;
      font-size: 13px;
    }

    .task-wrapper {
      width: auto;
      min-width: 0;
      margin-top: 7px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      column-gap: 7px;
      align-items: start;
      width: 100%;
      min-width: 0;
      padding: 6px;
      border-radius: 5px;
      background: #f4f5f7;
    }

    .task-checkbox {
      width: 17px;
      height: 17px;
      margin-top: 6px;
      cursor: pointer;
    }

    .task-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-rows: auto auto;
      gap: 5px 6px;
      align-items: start;
      min-width: 0;
    }

    .task-name {
      grid-column: 1 / 4;
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 34px;
      resize: none;
      overflow: hidden;
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      padding: 7px 8px;
      background: #ffffff;
      color: #172b4d;
      font: inherit;
      line-height: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .task-name:focus {
      border-color: #0c66e4;
      outline: 2px solid #0c66e433;
    }

    .task-name.completed {
      color: #5e6c84;
      text-decoration: line-through;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .subtask-button {
      grid-column: 1;
      justify-self: start;
      color: #0055cc;
      background: #e9f2ff;
      font-size: 12px;
      white-space: nowrap;
    }

    .subtask-button:hover {
      background: #cce0ff;
    }

    .delete-button {
      grid-column: 3;
      justify-self: end;
      color: #ae2a19;
      background: transparent;
      font-size: 20px;
      line-height: 20px;
    }

    .delete-button:hover {
      background: #ffebe6;
    }

    #add-task {
      margin-top: 12px;
      color: #ffffff;
      background: #0c66e4;
    }

    #add-task:hover {
      background: #0055cc;
    }

    @media (max-width: 430px) {
      body {
        padding: 8px;
      }

      .task-wrapper {
        margin-left: 0 !important;
      }

      .task-content {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .task-name {
        grid-column: 1 / 3;
      }

      .subtask-button {
        grid-column: 1;
      }

      .delete-button {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>
  <h3>Nested Tasks</h3>
  <p id="status">Loading…</p>

  <div class="progress" aria-label="Nested task progress">
    <div class="progress-header">
      <span id="progress-text">Progress: 0 / 0 · 0%</span>
    </div>

    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </div>

  <div id="tasks"></div>

  <button id="add-task" type="button">
    + Add task
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const STORAGE_KEY = 'nested-tasks';

    const trello = window.TrelloPowerUp.iframe();

    const statusElement = document.getElementById('status');
    const tasksElement = document.getElementById('tasks');
    const addTaskButton = document.getElementById('add-task');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');

    let data = {
      version: 1,
      tasks: []
    };

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.className = isError ? 'error' : '';
    }

    function createId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function createTask(parentId = null) {
      return {
        id: createId(),
        parentId,
        text: 'New task',
        completed: false
      };
    }

    function getChildren(parentId) {
      return data.tasks.filter(task => task.parentId === parentId);
    }

    function getDescendantIds(taskId) {
      const ids = new Set([taskId]);
      let foundNewChild = true;

      while (foundNewChild) {
        foundNewChild = false;

        for (const task of data.tasks) {
          if (ids.has(task.parentId) && !ids.has(task.id)) {
            ids.add(task.id);
            foundNewChild = true;
          }
        }
      }

      return ids;
    }

    function getProgress() {
      const total = data.tasks.length;

      const completed = data.tasks.filter(
        task => task.completed
      ).length;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      return {
        total,
        completed,
        percentage
      };
    }

    function updateProgress() {
      const progress = getProgress();

      progressText.textContent =
        `Progress: ${progress.completed} / ${progress.total} · ${progress.percentage}%`;

      progressFill.style.width = `${progress.percentage}%`;

      progressFill.classList.toggle(
        'complete',
        progress.total > 0 &&
        progress.completed === progress.total
      );
    }

    function resizeTextArea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    async function resizeIframe() {
      try {
        await trello.sizeTo(document.body);
      } catch (error) {
        console.warn('Could not resize Power-Up iframe:', error);
      }
    }

    async function saveData() {
      try {
        setStatus('Saving…');

        await trello.set(
          'card',
          'private',
          STORAGE_KEY,
          data
        );

        setStatus('Saved.');
        await resizeIframe();
      } catch (error) {
        console.error('Could not save nested tasks:', error);
        setStatus(`Save failed: ${error.message}`, true);
      }
    }

    function focusTask(taskId) {
      const wrapper = document.querySelector(
        `[data-task-id="${taskId}"]`
      );

      if (!wrapper) {
        return;
      }

      const input = wrapper.querySelector('.task-name');

      if (input) {
        input.focus();
        input.select();
        resizeTextArea(input);
      }
    }

    function createTaskElement(task, level) {
      const wrapper = document.createElement('div');
      wrapper.className = 'task-wrapper';
      wrapper.dataset.taskId = task.id;

      if (window.innerWidth > 430) {
        wrapper.style.marginLeft = `${level * 22}px`;
      }

      const row = document.createElement('div');
      row.className = 'task-row';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'task-checkbox';
      checkbox.checked = task.completed;
      checkbox.title = 'Mark task as complete';

      const content = document.createElement('div');
      content.className = 'task-content';

      const nameInput = document.createElement('textarea');
      nameInput.className = 'task-name';
      nameInput.value = task.text;
      nameInput.rows = 1;
      nameInput.title = 'Click here to edit the task';
      nameInput.setAttribute('aria-label', 'Task name');

      if (task.completed) {
        nameInput.classList.add('completed');
      }

      const subtaskButton = document.createElement('button');
      subtaskButton.type = 'button';
      subtaskButton.className = 'subtask-button';
      subtaskButton.textContent = '+ Subtask';
      subtaskButton.title = 'Add a nested task';

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = '×';
      deleteButton.title = 'Delete this task and its subtasks';

      resizeTextArea(nameInput);

      nameInput.addEventListener('input', () => {
        resizeTextArea(nameInput);
        resizeIframe();
      });

      nameInput.addEventListener('change', async () => {
        const newText = nameInput.value.trim();

        if (!newText) {
          nameInput.value = task.text;
          resizeTextArea(nameInput);
          return;
        }

        if (newText !== task.text) {
          task.text = newText;
          await saveData();
        }
      });

      nameInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          nameInput.blur();
        }

        if (event.key === 'Escape') {
          event.preventDefault();
          nameInput.value = task.text;
          resizeTextArea(nameInput);
          nameInput.blur();
        }
      });

      checkbox.addEventListener('change', async () => {
        task.completed = checkbox.checked;
        nameInput.classList.toggle('completed', task.completed);

        updateProgress();
        await saveData();
      });

      subtaskButton.addEventListener('click', async () => {
        const child = createTask(task.id);

        data.tasks.push(child);
        renderTasks();
        await saveData();
        focusTask(child.id);
      });

      deleteButton.addEventListener('click', async () => {
        const idsToDelete = getDescendantIds(task.id);

        data.tasks = data.tasks.filter(
          currentTask => !idsToDelete.has(currentTask.id)
        );

        renderTasks();
        await saveData();
      });

      content.appendChild(nameInput);
      content.appendChild(subtaskButton);
      content.appendChild(deleteButton);

      row.appendChild(checkbox);
      row.appendChild(content);
      wrapper.appendChild(row);

      for (const child of getChildren(task.id)) {
        wrapper.appendChild(createTaskElement(child, level + 1));
      }

      return wrapper;
    }

    function renderTasks() {
      tasksElement.replaceChildren();
      updateProgress();

      const rootTasks = getChildren(null);

      if (rootTasks.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = 'No tasks yet. Add your first task below.';
        tasksElement.appendChild(empty);
        resizeIframe();
        return;
      }

      for (const task of rootTasks) {
        tasksElement.appendChild(createTaskElement(task, 0));
      }

      resizeIframe();
    }

    async function start() {
      try {
        setStatus('Loading…');

        const storedData = await trello.get(
          'card',
          'private',
          STORAGE_KEY
        );

        if (
          storedData &&
          typeof storedData === 'object' &&
          Array.isArray(storedData.tasks)
        ) {
          data = storedData;
        }

        renderTasks();
        setStatus('Ready. Click a task name to edit it.');

        addTaskButton.addEventListener('click', async () => {
          const task = createTask(null);

          data.tasks.push(task);
          renderTasks();
          await saveData();
          focusTask(task.id);
        });

        await resizeIframe();
      } catch (error) {
        console.error('Nested Tasks failed to start:', error);
        setStatus(`Power-Up error: ${error.message}`, true);
      }
    }

    start();
  </script>
</body>
</html>
