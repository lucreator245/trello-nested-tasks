<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checklist</title>

  <style>
    :root {
      color-scheme: light;

      --background: #ffffff;
      --surface: #f4f5f7;
      --input-background: #ffffff;
      --border: #dfe1e6;
      --text: #172b4d;
      --muted: #5e6c84;
      --primary: #0c66e4;
      --primary-hover: #0055cc;
      --primary-soft: #e9f2ff;
      --danger: #ae2a19;
      --danger-hover: #ffebe6;
      --track: #dfe1e6;
      --complete: #22a06b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
    }

    body {
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    #status {
      min-height: 0;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 18px;
    }

    #status:empty {
      display: none;
    }

    #status.error {
      display: block;
      margin: 0 0 10px;
      color: var(--danger);
      font-weight: 600;
    }

    .checklist-title {
      display: block;
      width: 100%;
      min-height: 34px;
      margin: 0 0 10px;
      resize: none;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 5px 6px;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      line-height: 20px;
      font-family: inherit;
    }

    .checklist-title:hover,
    .checklist-title:focus {
      border-color: var(--border);
      background: var(--input-background);
      outline: none;
    }

    .checklist-title:focus {
      border-color: var(--primary);
      outline: 2px solid color-mix(
        in srgb,
        var(--primary) 25%,
        transparent
      );
    }

    .progress {
      margin: 0 0 14px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 18px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 160ms ease, background-color 160ms ease;
    }

    .progress-fill.complete {
      background: var(--complete);
    }

    #tasks {
      width: 100%;
      min-width: 0;
    }

    .task-wrapper {
      width: auto;
      min-width: 0;
      margin-top: 7px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      column-gap: 7px;
      align-items: start;
      width: 100%;
      min-width: 0;
      padding: 6px;
      border-radius: 5px;
      background: var(--surface);
    }

    .task-checkbox {
      width: 17px;
      height: 17px;
      margin-top: 6px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .task-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-rows: auto auto;
      gap: 5px 6px;
      align-items: start;
      min-width: 0;
    }

    .task-name {
      grid-column: 1 / 4;
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 34px;
      resize: none;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 8px;
      background: var(--input-background);
      color: var(--text);
      font: inherit;
      line-height: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .task-name:focus {
      border-color: var(--primary);
      outline: 2px solid color-mix(
        in srgb,
        var(--primary) 25%,
        transparent
      );
    }

    .task-name.completed {
      color: var(--muted);
      text-decoration: line-through;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .subtask-button {
      grid-column: 1;
      justify-self: start;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .subtask-button:hover {
      background: color-mix(
        in srgb,
        var(--primary-soft) 80%,
        var(--primary)
      );
    }

    .delete-button {
      grid-column: 3;
      justify-self: end;
      color: var(--danger);
      background: transparent;
      font-size: 20px;
      line-height: 20px;
    }

    .delete-button:hover {
      background: var(--danger-hover);
    }

    #add-task {
      margin-top: 12px;
      color: #ffffff;
      background: var(--primary);
    }

    #add-task:hover {
      background: var(--primary-hover);
    }

    @media (max-width: 430px) {
      body {
        padding: 8px;
      }

      .task-wrapper {
        margin-left: 0 !important;
      }

      .task-content {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .task-name {
        grid-column: 1 / 3;
      }

      .subtask-button {
        grid-column: 1;
      }

      .delete-button {
        grid-column: 2;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --background: #1d2125;
        --surface: #22272b;
        --input-background: #22272b;
        --border: #454f59;
        --text: #b6c2cf;
        --muted: #9fadbc;
        --primary: #579dff;
        --primary-hover: #85b8ff;
        --primary-soft: #1c2b41;
        --danger: #f87168;
        --danger-hover: #42221f;
        --track: #454f59;
        --complete: #4bce97;
      }
    }
  </style>
</head>

<body>
  <p id="status"></p>

  <textarea
    id="checklist-title"
    class="checklist-title"
    rows="1"
    aria-label="Checklist name"
    title="Click to rename this checklist"
  >Checklist</textarea>

  <div class="progress" aria-label="Checklist progress">
    <div class="progress-header">
      <span id="progress-text">Progress: 0 / 0 · 0%</span>
    </div>

    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </div>

  <div id="tasks"></div>

  <button id="add-task" type="button">
    + Add task
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const STORAGE_KEY = 'nested-tasks';

    const trello = window.TrelloPowerUp.iframe();

    const statusElement = document.getElementById('status');
    const checklistTitle = document.getElementById('checklist-title');
    const tasksElement = document.getElementById('tasks');
    const addTaskButton = document.getElementById('add-task');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');

    let data = {
      version: 1,
      checklistName: 'Checklist',
      tasks: []
    };

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.className = isError ? 'error' : '';
    }

    function createId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function createTask(parentId = null) {
      return {
        id: createId(),
        parentId,
        text: 'New task',
        completed: false
      };
    }

    function getChildren(parentId) {
      return data.tasks.filter(task => task.parentId === parentId);
    }

    function getDescendantIds(taskId) {
      const ids = new Set([taskId]);
      let foundNewChild = true;

      while (foundNewChild) {
        foundNewChild = false;

        for (const task of data.tasks) {
          if (ids.has(task.parentId) && !ids.has(task.id)) {
            ids.add(task.id);
            foundNewChild = true;
          }
        }
      }

      return ids;
    }

    function resizeTextArea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function updateProgress() {
      const total = data.tasks.length;

      const completed = data.tasks.filter(
        task => task.completed
      ).length;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      progressText.textContent =
        `Progress: ${completed} / ${total} · ${percentage}%`;

      progressFill.style.width = `${percentage}%`;

      progressFill.classList.toggle(
        'complete',
        total > 0 && completed === total
      );
    }

    async function resizeIframe() {
      try {
        await trello.sizeTo(document.body);
      } catch (error) {
        console.warn('Could not resize Power-Up iframe:', error);
      }
    }

    async function saveData() {
      try {
        await trello.set(
          'card',
          'private',
          STORAGE_KEY,
          data
        );

        await resizeIframe();
      } catch (error) {
        console.error('Could not save checklist:', error);
        setStatus(`Save failed: ${error.message}`, true);
      }
    }

    function focusTask(taskId) {
      const wrapper = document.querySelector(
        `[data-task-id="${taskId}"]`
      );

      if (!wrapper) {
        return;
      }

      const input = wrapper.querySelector('.task-name');

      if (input) {
        input.focus();
        input.select();
        resizeTextArea(input);
      }
    }

    function createTaskElement(task, level) {
      const wrapper = document.createElement('div');
      wrapper.className = 'task-wrapper';
      wrapper.dataset.taskId = task.id;

      if (window.innerWidth > 430) {
        wrapper.style.marginLeft = `${level * 22}px`;
      }

      const row = document.createElement('div');
      row.className = 'task-row';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'task-checkbox';
      checkbox.checked = task.completed;
      checkbox.title = 'Mark task as complete';

      const content = document.createElement('div');
      content.className = 'task-content';

      const nameInput = document.createElement('textarea');
      nameInput.className = 'task-name';
      nameInput.value = task.text;
      nameInput.rows = 1;
      nameInput.title = 'Click here to edit the task';
      nameInput.setAttribute('aria-label', 'Task name');

      if (task.completed) {
        nameInput.classList.add('completed');
      }

      const subtaskButton = document.createElement('button');
      subtaskButton.type = 'button';
      subtaskButton.className = 'subtask-button';
      subtaskButton.textContent = '+ Subtask';
      subtaskButton.title = 'Add a nested task';

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = '×';
      deleteButton.title = 'Delete this task and its subtasks';

      resizeTextArea(nameInput);

      nameInput.addEventListener('input', () => {
        resizeTextArea(nameInput);
        resizeIframe();
      });

      nameInput.addEventListener('change', async () => {
        const newText = nameInput.value.trim();

        if (!newText) {
          nameInput.value = task.text;
          resizeTextArea(nameInput);
          return;
        }

        if (newText !== task.text) {
          task.text = newText;
          await saveData();
        }
      });

      nameInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          nameInput.blur();
        }

        if (event.key === 'Escape') {
          event.preventDefault();
          nameInput.value = task.text;
          resizeTextArea(nameInput);
          nameInput.blur();
        }
      });

      checkbox.addEventListener('change', async () => {
        task.completed = checkbox.checked;
        nameInput.classList.toggle('completed', task.completed);
        updateProgress();
        await saveData();
      });

      subtaskButton.addEventListener('click', async () => {
        const child = createTask(task.id);

        data.tasks.push(child);
        renderTasks();
        await saveData();
        focusTask(child.id);
      });

      deleteButton.addEventListener('click', async () => {
        const idsToDelete = getDescendantIds(task.id);

        data.tasks = data.tasks.filter(
          currentTask => !idsToDelete.has(currentTask.id)
        );

        renderTasks();
        await saveData();
      });

      content.appendChild(nameInput);
      content.appendChild(subtaskButton);
      content.appendChild(deleteButton);

      row.appendChild(checkbox);
      row.appendChild(content);
      wrapper.appendChild(row);

      for (const child of getChildren(task.id)) {
        wrapper.appendChild(createTaskElement(child, level + 1));
      }

      return wrapper;
    }

    function renderTasks() {
      tasksElement.replaceChildren();
      updateProgress();

      const rootTasks = getChildren(null);

      for (const task of rootTasks) {
        tasksElement.appendChild(createTaskElement(task, 0));
      }

      resizeIframe();
    }

    async function start() {
      try {
        const storedData = await trello.get(
          'card',
          'private',
          STORAGE_KEY
        );

        if (
          storedData &&
          typeof storedData === 'object' &&
          Array.isArray(storedData.tasks)
        ) {
          data = {
            version: storedData.version || 1,
            checklistName: storedData.checklistName || 'Checklist',
            tasks: storedData.tasks
          };
        }

        checklistTitle.value = data.checklistName;
        resizeTextArea(checklistTitle);

        checklistTitle.addEventListener('input', () => {
          resizeTextArea(checklistTitle);
          resizeIframe();
        });

        checklistTitle.addEventListener('change', async () => {
          const newName = checklistTitle.value.trim();

          if (!newName) {
            checklistTitle.value = data.checklistName;
            resizeTextArea(checklistTitle);
            return;
          }

          data.checklistName = newName;
          await saveData();
        });

        checklistTitle.addEventListener('keydown', event => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            checklistTitle.blur();
          }

          if (event.key === 'Escape') {
            event.preventDefault();
            checklistTitle.value = data.checklistName;
            resizeTextArea(checklistTitle);
            checklistTitle.blur();
          }
        });

        renderTasks();

        addTaskButton.addEventListener('click', async () => {
          const task = createTask(null);

          data.tasks.push(task);
          renderTasks();
          await saveData();
          focusTask(task.id);
        });

        await resizeIframe();
      } catch (error) {
        console.error('Checklist failed to start:', error);
        setStatus(`Power-Up error: ${error.message}`, true);
      }
    }

    start();
  </script>
</body>
</html>
