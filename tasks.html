<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nested Tasks</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #ffffff;
      color: #172b4d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    #status {
      margin: 0 0 10px;
      color: #5e6c84;
      font-size: 13px;
    }

    #status.error {
      color: #ae2a19;
      font-weight: 600;
    }

    #tasks {
      margin-bottom: 10px;
    }

    .empty {
      margin: 8px 0 12px;
      color: #5e6c84;
      font-size: 13px;
    }

    .task-wrapper {
      margin-top: 6px;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 4px;
      border-radius: 5px;
      background: #f4f5f7;
    }

    .task-checkbox {
      flex: 0 0 auto;
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .task-name {
      flex: 1 1 auto;
      min-width: 0;
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      padding: 6px 8px;
      background: #ffffff;
      color: #172b4d;
      font: inherit;
    }

    .task-name:focus {
      border-color: #0c66e4;
      outline: 2px solid #0c66e433;
    }

    .task-name.completed {
      color: #5e6c84;
      text-decoration: line-through;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .subtask-button {
      flex: 0 0 auto;
      color: #0055cc;
      background: #e9f2ff;
      font-size: 12px;
      white-space: nowrap;
    }

    .subtask-button:hover {
      background: #cce0ff;
    }

    .delete-button {
      flex: 0 0 auto;
      color: #ae2a19;
      background: transparent;
      font-size: 20px;
      line-height: 20px;
    }

    .delete-button:hover {
      background: #ffebe6;
    }

    #add-task {
      margin-top: 8px;
      color: #ffffff;
      background: #0c66e4;
    }

    #add-task:hover {
      background: #0055cc;
    }
  </style>
</head>

<body>
  <h3>Nested Tasks</h3>
  <p id="status">Starting…</p>

  <div id="tasks"></div>

  <button id="add-task" type="button">
    + Add task
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    let trello;
    let data = {
      version: 1,
      tasks: []
    };

    const statusElement = document.getElementById('status');
    const tasksElement = document.getElementById('tasks');
    const addTaskButton = document.getElementById('add-task');

    function status(message, isError = false) {
      statusElement.textContent = message;
      statusElement.className = isError ? 'error' : '';
    }

    function newId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function newTask(parentId = null) {
      return {
        id: newId(),
        parentId,
        text: 'New task',
        completed: false
      };
    }

    function childrenOf(parentId) {
      return data.tasks.filter(task => task.parentId === parentId);
    }

    function allDescendants(taskId) {
      const ids = new Set([taskId]);
      let changed = true;

      while (changed) {
        changed = false;

        for (const task of data.tasks) {
          if (ids.has(task.parentId) && !ids.has(task.id)) {
            ids.add(task.id);
            changed = true;
          }
        }
      }

      return ids;
    }

    async function save() {
      try {
        status('Saving…');

        await trello.set(
          'card',
          'private',
          'nested-tasks',
          data
        );

        status('Saved.');
        await resize();
      } catch (error) {
        console.error('Save error:', error);
        status('Save failed: ' + error.message, true);
      }
    }

    async function resize() {
      try {
        await trello.sizeTo(document.body);
      } catch (error) {
        console.warn('Resize failed:', error);
      }
    }

    function focusTask(taskId) {
      const taskWrapper = document.querySelector(
        `[data-task-id="${taskId}"]`
      );

      if (!taskWrapper) {
        return;
      }

      const input = taskWrapper.querySelector('.task-name');

      if (input) {
        input.focus();
        input.select();
      }
    }

    function buildTask(task, level) {
      const wrapper = document.createElement('div');
      wrapper.className = 'task-wrapper';
      wrapper.dataset.taskId = task.id;
      wrapper.style.marginLeft = `${level * 22}px`;

      const row = document.createElement('div');
      row.className = 'task-row';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'task-checkbox';
      checkbox.checked = task.completed;
      checkbox.title = 'Complete task';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-name';
      input.value = task.text;
      input.title = 'Click to rename this task';

      if (task.completed) {
        input.classList.add('completed');
      }

      const addChild = document.createElement('button');
      addChild.type = 'button';
      addChild.className = 'subtask-button';
      addChild.textContent = '+ Subtask';

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete-button';
      remove.textContent = '×';
      remove.title = 'Delete task and children';

      checkbox.addEventListener('change', async () => {
        task.completed = checkbox.checked;
        input.classList.toggle('completed', task.completed);
        await save();
      });

      input.addEventListener('change', async () => {
        const value = input.value.trim();

        if (!value) {
          input.value = task.text;
          return;
        }

        task.text = value;
        await save();
      });

      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          input.blur();
        }

        if (event.key === 'Escape') {
          event.preventDefault();
          input.value = task.text;
          input.blur();
        }
      });

      addChild.addEventListener('click', async () => {
        const child = newTask(task.id);

        data.tasks.push(child);
        render();
        await save();
        focusTask(child.id);
      });

      remove.addEventListener('click', async () => {
        const ids = allDescendants(task.id);

        data.tasks = data.tasks.filter(
          currentTask => !ids.has(currentTask.id)
        );

        render();
        await save();
      });

      row.appendChild(checkbox);
      row.appendChild(input);
      row.appendChild(addChild);
      row.appendChild(remove);

      wrapper.appendChild(row);

      for (const child of childrenOf(task.id)) {
        wrapper.appendChild(buildTask(child, level + 1));
      }

      return wrapper;
    }

    function render() {
      tasksElement.replaceChildren();

      const rootTasks = childrenOf(null);

      if (rootTasks.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No tasks yet.';
        tasksElement.appendChild(empty);
        return;
      }

      for (const task of rootTasks) {
        tasksElement.appendChild(buildTask(task, 0));
      }
    }

    async function start() {
      try {
        status('Connecting to Trello…');

        if (!window.TrelloPowerUp) {
          throw new Error('Trello Power-Up library was not loaded.');
        }

        trello = window.TrelloPowerUp.iframe();

        /*
          Render immediately.
          Storage is loaded afterward so a storage problem cannot
          leave the entire interface stuck on "Loading".
        */
        render();
        status('Ready. Click a task name to edit it.');

        try {
          const stored = await Promise.race([
            trello.get('card', 'private', 'nested-tasks'),
            new Promise((_, reject) =>
              setTimeout(
                () => reject(new Error('Storage request timed out')),
                5000
              )
            )
          ]);

          if (
            stored &&
            typeof stored === 'object' &&
            Array.isArray(stored.tasks)
          ) {
            data = stored;
            render();
          }

          status('Ready. Click a task name to edit it.');
        } catch (storageError) {
          console.warn('Could not load stored tasks:', storageError);
          status('Ready. Existing tasks could not be loaded.');
        }

        addTaskButton.addEventListener('click', async () => {
          const task = newTask(null);

          data.tasks.push(task);
          render();
          await save();
          focusTask(task.id);
        });

        await resize();
      } catch (error) {
        console.error('Startup error:', error);
        status('Power-Up error: ' + error.message, true);
      }
    }

    start();
  </script>
</body>
</html>
