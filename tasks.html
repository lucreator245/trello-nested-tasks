<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nested Tasks</title>

  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #172b4d;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    #status {
      margin: 0 0 10px;
      color: #5e6c84;
      font-size: 13px;
    }

    #tasks {
      margin-bottom: 12px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      padding: 6px;
      border-radius: 4px;
      background: #f4f5f7;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 7px 10px;
      color: #ffffff;
      background: #0c66e4;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #0055cc;
    }

    .error {
      color: #ae2a19 !important;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <h3>Nested Tasks</h3>
  <p id="status">Loading Trello connection…</p>

  <div id="tasks"></div>

  <button id="add-task" type="button">
    + Add task
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const status = document.getElementById('status');
    const tasksElement = document.getElementById('tasks');
    const addButton = document.getElementById('add-task');

    let t;
    let tasks = [];

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? 'error' : '';
    }

    function drawTasks() {
      tasksElement.replaceChildren();

      if (tasks.length === 0) {
        const empty = document.createElement('p');
        empty.textContent = 'No tasks yet.';
        empty.style.color = '#5e6c84';
        tasksElement.appendChild(empty);
        return;
      }

      for (const task of tasks) {
        const row = document.createElement('div');
        row.className = 'task';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;

        const label = document.createElement('span');
        label.textContent = task.text;

        if (task.done) {
          label.style.textDecoration = 'line-through';
          label.style.color = '#5e6c84';
        }

        checkbox.addEventListener('change', async () => {
          task.done = checkbox.checked;
          await saveTasks();
        });

        row.appendChild(checkbox);
        row.appendChild(label);
        tasksElement.appendChild(row);
      }
    }

    async function saveTasks() {
      try {
        setStatus('Saving…');
        await t.set('card', 'private', 'nested-tasks', tasks);
        drawTasks();
        setStatus('Saved.');
        await t.sizeTo(document.body);
      } catch (error) {
        console.error(error);
        setStatus('Save failed: ' + error.message, true);
      }
    }

    async function start() {
      try {
        if (!window.TrelloPowerUp) {
          throw new Error('Trello Power-Up library did not load.');
        }

        t = window.TrelloPowerUp.iframe();

        tasks = await t.get('card', 'private', 'nested-tasks') || [];

        drawTasks();
        setStatus('Ready. Tasks are saved on this Trello card.');

        addButton.addEventListener('click', async () => {
          tasks.push({
            id: String(Date.now()),
            text: 'New task',
            done: false
          });

          await saveTasks();
        });

        await t.sizeTo(document.body);
      } catch (error) {
        console.error(error);
        setStatus('Power-Up error: ' + error.message, true);
      }
    }

    start();
  </script>
</body>
</html>
