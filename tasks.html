<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nested Tasks</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #ffffff;
      color: #172b4d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    #status {
      min-height: 18px;
      margin: 0 0 10px;
      color: #5e6c84;
      font-size: 13px;
    }

    #status.error {
      color: #ae2a19;
      font-weight: 600;
    }

    .task-wrapper {
      margin-top: 6px;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 4px;
      border-radius: 5px;
      background: #f4f5f7;
    }

    .task-checkbox {
      flex: 0 0 auto;
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .task-name {
      flex: 1 1 auto;
      min-width: 0;
      border: 1px solid #dfe1e6;
      border-radius: 4px;
      padding: 6px 8px;
      background: #ffffff;
      color: #172b4d;
      font: inherit;
    }

    .task-name:focus {
      border-color: #0c66e4;
      outline: 2px solid #0c66e433;
    }

    .task-name.completed {
      color: #5e6c84;
      text-decoration: line-through;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .subtask-button {
      flex: 0 0 auto;
      color: #0055cc;
      background: #e9f2ff;
      font-size: 12px;
      white-space: nowrap;
    }

    .subtask-button:hover {
      background: #cce0ff;
    }

    .delete-button {
      flex: 0 0 auto;
      color: #ae2a19;
      background: transparent;
      font-size: 20px;
      line-height: 20px;
    }

    .delete-button:hover {
      background: #ffebe6;
    }

    #add-task {
      margin-top: 10px;
      color: #ffffff;
      background: #0c66e4;
    }

    #add-task:hover {
      background: #0055cc;
    }

    .empty-state {
      margin: 8px 0 12px;
      color: #5e6c84;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h3>Nested Tasks</h3>
  <p id="status">Loading…</p>

  <div id="tasks"></div>

  <button id="add-task" type="button">+ Add task</button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const STORAGE_KEY = 'nested-tasks';

    const statusElement = document.getElementById('status');
    const tasksElement = document.getElementById('tasks');
    const addTaskButton = document.getElementById('add-task');

    const trello = window.TrelloPowerUp.iframe();

    let data = {
      version: 1,
      tasks: []
    };

    function setStatus(text, isError = false) {
      statusElement.textContent = text;
      statusElement.className = isError ? 'error' : '';
    }

    function createId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function createTask(parentId = null) {
      return {
        id: createId(),
        parentId: parentId,
        text: 'New task',
        completed: false
      };
    }

    function getChildren(parentId) {
      return data.tasks.filter(task => task.parentId === parentId);
    }

    function getAllChildIds(taskId) {
      const ids = new Set([taskId]);
      let changed = true;

      while (changed) {
        changed = false;

        for (const task of data.tasks) {
          if (ids.has(task.parentId) && !ids.has(task.id)) {
            ids.add(task.id);
            changed = true;
          }
        }
      }

      return ids;
    }

    async function saveData() {
      try {
        setStatus('Saving…');

        await trello.set(
          'card',
          'private',
          STORAGE_KEY,
          data
        );

        setStatus('Saved.');
        await resizeIframe();
      } catch (error) {
        console.error(error);
        setStatus('Save failed: ' + error.message, true);
      }
    }

    async function resizeIframe() {
      try {
        await trello.sizeTo(document.body);
      } catch (error) {
        console.warn('Could not resize iframe:', error);
      }
    }

    function focusTask(taskId) {
      const input = document.querySelector(
        `[data-task-id="${taskId}"] .task-name`
      );

      if (input) {
        input.focus();
        input.select();
      }
    }

    function createTaskElement(task, level) {
      const wrapper = document.createElement('div');
      wrapper.className = 'task-wrapper';
      wrapper.dataset.taskId = task.id;
      wrapper.style.marginLeft = `${level * 22}px`;

      const row = document.createElement('div');
      row.className = 'task-row';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'task-checkbox';
