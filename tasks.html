<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nested Tasks</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main id="app">
    <div id="task-list"></div>

    <button id="add-root-task" class="add-root-task">
      + Add task
    </button>
  </main>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const t = window.TrelloPowerUp.iframe();

    const EMPTY_DATA = {
      version: 1,
      tasks: []
    };

    function createTask(text, parentId = null) {
      return {
        id: crypto.randomUUID(),
        text: text,
        completed: false,
        parentId: parentId
      };
    }

    async function loadTasks() {
      return await t.get('card', 'private', 'nested-tasks') || EMPTY_DATA;
    }

    async function saveTasks(data) {
      await t.set('card', 'private', 'nested-tasks', data);
      await t.render();
    }

    function getChildren(parentId, tasks) {
      return tasks.filter(task => task.parentId === parentId);
    }

    function getTaskAndChildrenIds(taskId, tasks) {
      const ids = new Set([taskId]);
      let foundNewTasks = true;

      while (foundNewTasks) {
        foundNewTasks = false;

        for (const task of tasks) {
          if (ids.has(task.parentId) && !ids.has(task.id)) {
            ids.add(task.id);
            foundNewTasks = true;
          }
        }
      }

      return ids;
    }

    function renderTask(task, data, level) {
      const wrapper = document.createElement('div');
      wrapper.className = 'task-wrapper';
      wrapper.style.marginLeft = `${level * 22}px`;

      const row = document.createElement('div');
      row.className = 'task-row';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.completed;
      checkbox.className = 'task-checkbox';
      checkbox.title = 'Complete task';

      const text = document.createElement('input');
      text.type = 'text';
      text.value = task.text;
      text.className = 'task-text';

      if (task.completed) {
        text.classList.add('completed');
      }

      const addSubtask = document.createElement('button');
      addSubtask.textContent = '+ Subtask';
      addSubtask.className = 'subtask-button';
      addSubtask.title = 'Add a subtask';

      const remove = document.createElement('button');
      remove.textContent = '×';
      remove.className = 'delete-button';
      remove.title = 'Delete task and its subtasks';

      checkbox.addEventListener('change', async () => {
        task.completed = checkbox.checked;
        await saveTasks(data);
      });

      text.addEventListener('change', async () => {
        const newText = text.value.trim();

        if (newText) {
          task.text = newText;
          await saveTasks(data);
        } else {
          text.value = task.text;
        }
      });

      addSubtask.addEventListener('click', async () => {
        data.tasks.push(createTask('New subtask', task.id));
        await saveTasks(data);
      });

      remove.addEventListener('click', async () => {
        const idsToRemove = getTaskAndChildrenIds(task.id, data.tasks);

        data.tasks = data.tasks.filter(
          currentTask => !idsToRemove.has(currentTask.id)
        );

        await saveTasks(data);
      });

      row.appendChild(checkbox);
      row.appendChild(text);
      row.appendChild(addSubtask);
      row.appendChild(remove);
      wrapper.appendChild(row);

      const children = getChildren(task.id, data.tasks);

      for (const child of children) {
        wrapper.appendChild(renderTask(child, data, level + 1));
      }

      return wrapper;
    }

    function renderTaskList(data) {
      const list = document.querySelector('#task-list');
      list.replaceChildren();

      const rootTasks = getChildren(null, data.tasks);

      if (rootTasks.length === 0) {
        const message = document.createElement('p');
        message.className = 'empty-state';
        message.textContent = 'No tasks yet. Add your first task below.';
        list.appendChild(message);
        return;
      }

      for (const task of rootTasks) {
        list.appendChild(renderTask(task, data, 0));
      }
    }

    t.render(async () => {
  const data = await loadTasks();

  renderTaskList(data);

  const addButton = document.querySelector('#add-root-task');

  addButton.onclick = async () => {
    addButton.disabled = true;
    addButton.textContent = 'Saving…';

    try {
      const freshData = await loadTasks();
      freshData.tasks.push(createTask('New task'));
      await saveTasks(freshData);
    } catch (error) {
      console.error(error);
      addButton.disabled = false;
      addButton.textContent = '+ Add task';
      alert('Could not save the task. Please try again.');
    }
  };

  await t.sizeTo('#app');
});
  </script>
</body>
</html>
