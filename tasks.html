<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checklist</title>

  <style>
    :root {
      color-scheme: light;

      --background: #ffffff;
      --surface-hover: #f4f5f7;
      --surface-dragging: #e9f2ff;
      --border: #dfe1e6;
      --text: #172b4d;
      --muted: #5e6c84;
      --primary: #0c66e4;
      --primary-hover: #0055cc;
      --primary-soft: #e9f2ff;
      --danger: #ae2a19;
      --danger-hover: #ffebe6;
      --track: #dfe1e6;
      --complete: #22a06a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
    }

    body {
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    #status {
      display: none;
    }

    .checklist-title {
      display: block;
      width: 100%;
      min-height: 28px;
      margin: 0 0 6px;
      resize: none;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 3px 4px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
      font-family: inherit;
    }

    .checklist-title:hover,
    .checklist-title:focus {
      border-color: var(--border);
      background: var(--background);
      outline: none;
    }

    .progress {
      margin: 0 0 7px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 160ms ease, background-color 160ms ease;
    }

    .progress-fill.complete {
      background: var(--complete);
    }

    #tasks {
      width: 100%;
      min-width: 0;
      margin-top: 2px;
    }

    .task-wrapper {
      width: auto;
      min-width: 0;
    }

    .task-row {
      display: grid;
      grid-template-columns: 14px 18px minmax(0, 1fr) auto;
      gap: 5px;
      align-items: start;
      min-width: 0;
      min-height: 30px;
      padding: 2px 3px;
      border-radius: 3px;
    }

    .task-row:hover {
      background: var(--surface-hover);
    }

    .task-wrapper.dragging .task-row {
      opacity: 0.45;
      background: var(--surface-dragging);
    }

    .task-wrapper.drag-over-before .task-row {
      box-shadow: inset 0 2px 0 var(--primary);
    }

    .task-wrapper.drag-over-after .task-row {
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .drag-handle {
      width: 14px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 3px;
      color: var(--muted);
      background: transparent;
      cursor: grab;
      font-size: 16px;
      line-height: 22px;
      text-align: center;
      opacity: 0;
      user-select: none;
    }

    .task-row:hover .drag-handle,
    .task-row:focus-within .drag-handle,
    .drag-handle:focus {
      opacity: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .task-checkbox {
      width: 16px;
      height: 16px;
      margin-top: 5px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .task-name {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 26px;
      resize: none;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 3px 4px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      line-height: 19px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .task-name:hover,
    .task-name:focus {
      border-color: var(--border);
      background: var(--background);
      outline: none;
    }

    .task-name:focus {
      border-color: var(--primary);
      outline: 2px solid color-mix(
        in srgb,
        var(--primary) 20%,
        transparent
      );
    }

    .task-name.completed {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 26px;
      opacity: 0;
      transition: opacity 100ms ease;
    }

    .task-row:hover .task-actions,
    .task-row:focus-within .task-actions {
      opacity: 1;
    }

    .subtask-button,
    .delete-button {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      line-height: 24px;
      text-align: center;
    }

    .subtask-button {
      color: var(--primary);
      background: transparent;
      font-size: 18px;
    }

    .subtask-button:hover {
      background: var(--primary-soft);
      color: var(--primary-hover);
    }

    .delete-button {
      color: var(--danger);
      background: transparent;
      font-size: 18px;
    }

    .delete-button:hover {
      background: var(--danger-hover);
    }

    #add-task {
      margin-top: 6px;
      padding: 5px 8px;
      border: 0;
      border-radius: 3px;
      color: var(--primary);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }

    #add-task:hover {
      background: var(--primary-soft);
      color: var(--primary-hover);
    }

    @media (max-width: 430px) {
      body {
        padding: 5px;
      }

      .task-wrapper {
        margin-left: 0 !important;
      }

      .drag-handle,
      .task-actions {
        opacity: 1;
      }

      .delete-button {
        display: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --background: #1d2125;
        --surface-hover: #22272b;
        --surface-dragging: #1c2b41;
        --border: #454f59;
        --text: #b6c2cf;
        --muted: #9fadbc;
        --primary: #579dff;
        --primary-hover: #85b8ff;
        --primary-soft: #1c2b41;
        --danger: #f87168;
        --danger-hover: #42221f;
        --track: #454f59;
        --complete: #4bce97;
      }
    }
  </style>
</head>

<body>
  <p id="status"></p>

  <textarea
    id="checklist-title"
    class="checklist-title"
    rows="1"
    aria-label="Checklist name"
    title="Click to rename this checklist"
  >Checklist</textarea>

  <div class="progress" aria-label="Checklist progress">
    <div class="progress-header">
      <span id="progress-text">Progress: 0 / 0 · 0%</span>
    </div>

    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </div>

  <div id="tasks"></div>

  <button id="add-task" type="button">
    + Add task
  </button>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const STORAGE_KEY = 'nested-tasks';

    const trello = window.TrelloPowerUp.iframe();

    const checklistTitle = document.getElementById('checklist-title');
    const tasksElement = document.getElementById('tasks');
    const addTaskButton = document.getElementById('add-task');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const statusElement = document.getElementById('status');

    let data = {
      version: 1,
      checklistName: 'Checklist',
      tasks: []
    };

    let draggedTaskId = null;

    function createId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function createTask(parentId = null) {
      return {
        id: createId(),
        parentId,
        text: 'New task',
        completed: false
      };
    }

    function getChildren(parentId) {
      return data.tasks.filter(task => task.parentId === parentId);
    }

    function getDescendantIds(taskId) {
      const ids = new Set([taskId]);
      let changed = true;

      while (changed) {
        changed = false;

        for (const task of data.tasks) {
          if (ids.has(task.parentId) && !ids.has(task.id)) {
            ids.add(task.id);
            changed = true;
          }
        }
      }

      return ids;
    }

    function resizeTextArea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function updateProgress() {
      const total = data.tasks.length;

      const completed = data.tasks.filter(
        task => task.completed
      ).length;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      progressText.textContent =
        `Progress: ${completed} / ${total} · ${percentage}%`;

      progressFill.style.width = `${percentage}%`;

      progressFill.classList.toggle(
        'complete',
        total > 0 && completed === total
      );
    }

    async function resizeIframe() {
      try {
        await trello.sizeTo(document.body);
      } catch (error) {
        console.warn('Could not resize iframe:', error);
      }
    }

    async function saveData() {
      try {
        await trello.set(
          'card',
          'private',
          STORAGE_KEY,
          data
        );

        await resizeIframe();
      } catch (error) {
        console.error('Could not save checklist:', error);
        statusElement.textContent = `Save failed: ${error.message}`;
        statusElement.className = 'error';
      }
    }

    function focusTask(taskId) {
      const wrapper = document.querySelector(
        `[data-task-id="${taskId}"]`
      );

      if (!wrapper) {
        return;
      }

      const input = wrapper.querySelector('.task-name');

      if (input) {
        input.focus();
        input.select();
        resizeTextArea(input);
      }
    }

    function clearDragIndicators() {
      document.querySelectorAll(
        '.drag-over-before, .drag-over-after'
      ).forEach(element => {
        element.classList.remove(
          'drag-over-before',
          'drag-over-after'
        );
      });
    }

    function reorderSiblingTasks(draggedId, targetId, placeAfter) {
      const draggedTask = data.tasks.find(
        task => task.id === draggedId
      );

      const targetTask = data.tasks.find(
        task => task.id === targetId
      );

      if (
        !draggedTask ||
        !targetTask ||
        draggedTask.id === targetTask.id ||
        draggedTask.parentId !== targetTask.parentId
      ) {
        return false;
      }

      const parentId = draggedTask.parentId;

      const siblings = data.tasks.filter(
        task => task.parentId === parentId
      );

      const draggedIndex = siblings.findIndex(
        task => task.id === draggedId
      );

      const targetIndex = siblings.findIndex(
        task => task.id === targetId
      );

      if (draggedIndex === -1 || targetIndex === -1) {
        return false;
      }

      siblings.splice(draggedIndex, 1);

      let insertIndex = siblings.findIndex(
        task => task.id === targetId
      );

      if (placeAfter) {
        insertIndex += 1;
      }

      siblings.splice(insertIndex, 0, draggedTask);

      const siblingIds = new Set(
        data.tasks
          .filter(task => task.parentId === parentId)
          .map(task => task.id)
      );

      const orderedSiblingIds = siblings.map(task => task.id);

      const nonSiblingTasks = data.tasks.filter(
        task => !siblingIds.has(task.id)
      );

      const firstSiblingIndex = data.tasks.findIndex(
        task => task.parentId === parentId
      );

      const before = data.tasks
        .slice(0, firstSiblingIndex)
        .filter(task => !siblingIds.has(task.id));

      const after = data.tasks
        .slice(firstSiblingIndex)
        .filter(task => !siblingIds.has(task.id));

      const orderedSiblings = orderedSiblingIds.map(
        id => data.tasks.find(task => task.id === id)
      );

      data.tasks = [
        ...before,
        ...orderedSiblings,
        ...after
      ];

      return true;
    }

    function createTaskElement(task, level) {
      const wrapper = document.createElement('div');
      wrapper.className = 'task-wrapper';
      wrapper.dataset.taskId = task.id;

      if (window.innerWidth > 430) {
        wrapper.style.marginLeft = `${level * 20}px`;
      }

      const row = document.createElement('div');
      row.className = 'task-row';

      const dragHandle = document.createElement('button');
      dragHandle.type = 'button';
      dragHandle.className = 'drag-handle';
      dragHandle.textContent = '⠿';
      dragHandle.title = 'Drag to reorder';
      dragHandle.setAttribute('aria-label', 'Drag to reorder');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'task-checkbox';
      checkbox.checked = task.completed;
      checkbox.title = 'Complete task';

      const content = document.createElement('div');
      content.className = 'task-content';

      const nameInput = document.createElement('textarea');
      nameInput.className = 'task-name';
      nameInput.value = task.text;
      nameInput.rows = 1;
      nameInput.title = 'Click to edit task';
      nameInput.setAttribute('aria-label', 'Task name');

      if (task.completed) {
        nameInput.classList.add('completed');
      }

      const actions = document.createElement('div');
      actions.className = 'task-actions';

      const subtaskButton = document.createElement('button');
      subtaskButton.type = 'button';
      subtaskButton.className = 'subtask-button';
      subtaskButton.textContent = '+';
      subtaskButton.title = 'Add subtask';
      subtaskButton.setAttribute('aria-label', 'Add subtask');

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = '×';
      deleteButton.title = 'Delete task and subtasks';
      deleteButton.setAttribute('aria-label', 'Delete task');

      resizeTextArea(nameInput);

      dragHandle.addEventListener('pointerdown', () => {
        wrapper.draggable = true;
      });

      dragHandle.addEventListener('pointerup', () => {
        wrapper.draggable = false;
      });

      wrapper.addEventListener('dragstart', event => {
        if (!wrapper.draggable) {
          event.preventDefault();
          return;
        }

        draggedTaskId = task.id;

        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', task.id);

        requestAnimationFrame(() => {
          wrapper.classList.add('dragging');
        });
      });

      wrapper.addEventListener('dragend', () => {
        wrapper.classList.remove('dragging');
        wrapper.draggable = false;
        draggedTaskId = null;
        clearDragIndicators();
      });

      wrapper.addEventListener('dragover', event => {
        if (!draggedTaskId || draggedTaskId === task.id) {
          return;
        }

        const draggedTask = data.tasks.find(
          currentTask => currentTask.id === draggedTaskId
        );

        if (!draggedTask || draggedTask.parentId !== task.parentId) {
          return;
        }

        event.preventDefault();

        const bounds = wrapper.getBoundingClientRect();
        const placeAfter =
          event.clientY > bounds.top + bounds.height / 2;

        clearDragIndicators();

        wrapper.classList.add(
          placeAfter
            ? 'drag-over-after'
            : 'drag-over-before'
        );
      });

      wrapper.addEventListener('dragleave', event => {
        if (!wrapper.contains(event.relatedTarget)) {
          wrapper.classList.remove(
            'drag-over-before',
            'drag-over-after'
          );
        }
      });

      wrapper.addEventListener('drop', async event => {
        event.preventDefault();

        const placeAfter = wrapper.classList.contains(
          'drag-over-after'
        );

        const changed = reorderSiblingTasks(
          draggedTaskId,
          task.id,
          placeAfter
        );

        clearDragIndicators();

        if (changed) {
          renderTasks();
          await saveData();
        }
      });

      nameInput.addEventListener('input', () => {
        resizeTextArea(nameInput);
        resizeIframe();
      });

      nameInput.addEventListener('change', async () => {
        const newText = nameInput.value.trim();

        if (!newText) {
          nameInput.value = task.text;
          resizeTextArea(nameInput);
          return;
        }

        if (newText !== task.text) {
          task.text = newText;
          await saveData();
        }
      });

      nameInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          nameInput.blur();
        }

        if (event.key === 'Escape') {
          event.preventDefault();
          nameInput.value = task.text;
          resizeTextArea(nameInput);
          nameInput.blur();
        }
      });

      checkbox.addEventListener('change', async () => {
        task.completed = checkbox.checked;
        nameInput.classList.toggle('completed', task.completed);
        updateProgress();
        await saveData();
      });

      subtaskButton.addEventListener('click', async () => {
        const child = createTask(task.id);

        data.tasks.push(child);
        renderTasks();
        await saveData();
        focusTask(child.id);
      });

      deleteButton.addEventListener('click', async () => {
        const ids = getDescendantIds(task.id);

        data.tasks = data.tasks.filter(
          currentTask => !ids.has(currentTask.id)
        );

        renderTasks();
        await saveData();
      });

      actions.appendChild(subtaskButton);
      actions.appendChild(deleteButton);

      content.appendChild(nameInput);
      content.appendChild(actions);

      row.appendChild(dragHandle);
      row.appendChild(checkbox);
      row.appendChild(content);
      row.appendChild(actions.cloneNode(false));

      row.lastChild.remove();

      row.appendChild(actions);

      wrapper.appendChild(row);

      for (const child of getChildren(task.id)) {
        wrapper.appendChild(createTaskElement(child, level + 1));
      }

      return wrapper;
    }

    function renderTasks() {
      tasksElement.replaceChildren();
      updateProgress();

      for (const task of getChildren(null)) {
        tasksElement.appendChild(createTaskElement(task, 0));
      }

      resizeIframe();
    }

    async function start() {
      try {
        const savedData = await trello.get(
          'card',
          'private',
          STORAGE_KEY
        );

        if (
          savedData &&
          typeof savedData === 'object' &&
          Array.isArray(savedData.tasks)
        ) {
          data = {
            version: savedData.version || 1,
            checklistName: savedData.checklistName || 'Checklist',
            tasks: savedData.tasks
          };
        }

        checklistTitle.value = data.checklistName;
        resizeTextArea(checklistTitle);

        checklistTitle.addEventListener('input', () => {
          resizeTextArea(checklistTitle);
          resizeIframe();
        });

        checklistTitle.addEventListener('change', async () => {
          const newName = checklistTitle.value.trim();

          if (!newName) {
            checklistTitle.value = data.checklistName;
            resizeTextArea(checklistTitle);
            return;
          }

          data.checklistName = newName;
          await saveData();
        });

        checklistTitle.addEventListener('keydown', event => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            checklistTitle.blur();
          }

          if (event.key === 'Escape') {
            event.preventDefault();
            checklistTitle.value = data.checklistName;
            resizeTextArea(checklistTitle);
            checklistTitle.blur();
          }
        });

        renderTasks();

        addTaskButton.addEventListener('click', async () => {
          const task = createTask(null);

          data.tasks.push(task);
          renderTasks();
          await saveData();
          focusTask(task.id);
        });

        await resizeIframe();
      } catch (error) {
        console.error('Checklist failed to start:', error);
        statusElement.textContent = `Power-Up error: ${error.message}`;
        statusElement.className = 'error';
      }
    }

    start();
  </script>
</body>
</html>
