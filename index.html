<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nested Tasks</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const TASKS_URL =
      'https://lucreator245.github.io/trello-nested-tasks/tasks.html';

    const ICON_URL =
      'https://lucreator245.github.io/trello-nested-tasks/icon.svg';

    function getTaskCount(tasks) {
      let total = 0;
      let completed = 0;

      for (const task of tasks) {
        total++;

        if (task.completed) {
          completed++;
        }
      }

      return {
        total,
        completed
      };
    }

    window.TrelloPowerUp.initialize({
      'card-buttons': function (t) {
        return [
          {
            text: 'Nested Tasks',
            icon: ICON_URL,
            callback: function () {
              return t.popup({
                title: 'Nested Tasks',
                url: TASKS_URL,
                height: 500
              });
            }
          }
        ];
      },

      'card-badges': function (t) {
        return t.get('card', 'private', 'nested-tasks')
          .then(function (data) {
            const tasks =
              data && Array.isArray(data.tasks)
                ? data.tasks
                : [];

            const count = getTaskCount(tasks);

            if (count.total === 0) {
              return [];
            }

            return [
              {
                text: `${count.completed}/${count.total}`,
                icon: ICON_URL,
                color: count.completed === count.total
                  ? 'green'
                  : 'blue',
                refresh: 10
              }
            ];
          })
          .catch(function (error) {
            console.error('Could not load task badge:', error);
            return [];
          });
      },

      'card-back-section': function (t) {
        return {
          title: 'Nested Tasks',
          icon: ICON_URL,
          content: {
            type: 'iframe',
            url: t.signUrl(TASKS_URL),
            height: 450
          }
        };
      }
    });
  </script>
</body>
</html>
