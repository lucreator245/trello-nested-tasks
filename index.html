<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checklist</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const TASKS_URL =
      'https://lucreator245.github.io/trello-nested-tasks/tasks.html';

    const ICON_URL =
      'https://lucreator245.github.io/trello-nested-tasks/icon.svg';

    const STORAGE_KEY = 'nested-tasks';

    const MAX_PREVIEW_TASKS = 5;
    const MAX_PREVIEW_NAME_LENGTH = 26;

    function getChecklistData(data) {
      const tasks =
        data &&
        Array.isArray(data.tasks)
          ? data.tasks
          : [];

      const mainTasks = tasks.filter(
        task => task.parentId === null
      );

      const completedMainTasks = mainTasks.filter(
        task => task.completed
      ).length;

      const completedAllTasks = tasks.filter(
        task => task.completed
      ).length;

      return {
        tasks,
        mainTasks,
        mainTotal: mainTasks.length,
        mainCompleted: completedMainTasks,
        total: tasks.length,
        completed: completedAllTasks
      };
    }

    function shortenText(text, maxLength) {
      const cleanText = String(text || '')
        .replace(/\s+/g, ' ')
        .trim();

      if (cleanText.length <= maxLength) {
        return cleanText;
      }

      return cleanText
        .slice(0, maxLength - 1)
        .trimEnd() + '…';
    }

    function createTaskPreviewBadge(task) {
      return {
        text: `${task.completed ? '☑' : '☐'} ${shortenText(
          task.text,
          MAX_PREVIEW_NAME_LENGTH
        )}`,

        color: task.completed
          ? 'green'
          : 'blue',

        refresh: 5
      };
    }

    window.TrelloPowerUp.initialize({
      'card-buttons': function (t) {
        return [{
          text: 'Checklist',
          icon: ICON_URL,

          callback: function () {
            return t.popup({
              title: 'Checklist',
              url: TASKS_URL,
              height: 560
            });
          }
        }];
      },

      'card-badges': function (t) {
        return t.get(
          'card',
          'private',
          STORAGE_KEY
        ).then(function (data) {
          const checklist = getChecklistData(data);

          if (checklist.total === 0) {
            return [];
          }

          const allTasksComplete =
            checklist.completed === checklist.total;

          const progressBadge = {
            text:
              `☑ ${checklist.mainCompleted}/${checklist.mainTotal}`,

            color:
              allTasksComplete
                ? 'green'
                : 'blue',

            refresh: 5
          };

          const previewBadges = checklist.mainTasks
            .slice(0, MAX_PREVIEW_TASKS)
            .map(createTaskPreviewBadge);

          return [
            progressBadge,
            ...previewBadges
          ];
        }).catch(function (error) {
          console.error(
            'Could not load Checklist preview badges:',
            error
          );

          return [];
        });
      },

      'card-back-section': function (t) {
        return {
          title: 'Checklist',
          icon: ICON_URL,

          content: {
            type: 'iframe',
            url: t.signUrl(TASKS_URL),
            height: 560
          }
        };
      }
    });
  </script>
</body>
</html>
