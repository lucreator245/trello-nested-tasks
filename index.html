<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checklist</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const TASKS_URL =
      'https://lucreator245.github.io/trello-nested-tasks/tasks.html';

    const ICON_URL =
      'https://lucreator245.github.io/trello-nested-tasks/icon.svg';

    const STORAGE_KEY = 'nested-tasks';

    function getProgress(data) {
      const tasks =
        data &&
        Array.isArray(data.tasks)
          ? data.tasks
          : [];

      const total = tasks.length;

      const completed = tasks.filter(
        task => task.completed
      ).length;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      return {
        total,
        completed,
        percentage
      };
    }

    window.TrelloPowerUp.initialize({
      'card-buttons': function (t) {
        return [{
          text: 'Checklist',
          icon: ICON_URL,

          callback: function () {
            return t.popup({
              title: 'Checklist',
              url: TASKS_URL,
              height: 560
            });
          }
        }];
      },

      'card-badges': function (t) {
        return t.get('card', 'private', STORAGE_KEY)
          .then(function (data) {
            const progress = getProgress(data);

            if (progress.total === 0) {
              return [];
            }

            return [{
              icon: ICON_URL,
              text: `${progress.completed}/${progress.total} · ${progress.percentage}%`,
              color: progress.completed === progress.total
                ? 'green'
                : 'blue',
              refresh: 10
            }];
          })
          .catch(function (error) {
            console.error('Could not create Nested Tasks badge:', error);
            return [];
          });
      },

      'card-back-section': function (t) {
        return {
          title: 'Checklist',
          icon: ICON_URL,

          content: {
            type: 'iframe',
            url: t.signUrl(TASKS_URL),
            height: 560
          }
        };
      }
    });
  </script>
</body>
</html>
