<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checklist</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const TASKS_URL =
      'https://lucreator245.github.io/trello-nested-tasks/tasks.html';

    const ICON_URL =
      'https://lucreator245.github.io/trello-nested-tasks/icon.svg';

    const STORAGE_KEY = 'nested-tasks';

    function getMainTaskProgress(data) {
      const tasks =
        data &&
        Array.isArray(data.tasks)
          ? data.tasks
          : [];

      const mainTasks = tasks.filter(
        task => task.parentId === null
      );

      const total = mainTasks.length;

      const completed = mainTasks.filter(
        task => task.completed
      ).length;

      return {
        total,
        completed
      };
    }

    function getAllTaskProgress(data) {
      const tasks =
        data &&
        Array.isArray(data.tasks)
          ? data.tasks
          : [];

      const total = tasks.length;

      const completed = tasks.filter(
        task => task.completed
      ).length;

      return {
        total,
        completed
      };
    }

    window.TrelloPowerUp.initialize({
      'card-buttons': function (t) {
        return [{
          text: 'Checklist',
          icon: ICON_URL,

          callback: function () {
            return t.popup({
              title: 'Checklist',
              url: TASKS_URL,
              height: 560
            });
          }
        }];
      },

      'card-badges': function (t) {
        return t.get(
          'card',
          'private',
          STORAGE_KEY
        ).then(function (data) {
          const mainProgress = getMainTaskProgress(data);
          const allProgress = getAllTaskProgress(data);

          if (allProgress.total === 0) {
            return [];
          }

          const allComplete =
            allProgress.completed === allProgress.total;

          return [{
            icon: ICON_URL,
            text: `${mainProgress.completed}/${mainProgress.total}`,
            color: allComplete ? 'green' : 'blue',
            refresh: 5
          }];
        }).catch(function (error) {
          console.error(
            'Could not load checklist badge:',
            error
          );

          return [];
        });
      },

      'card-back-section': function (t) {
        return {
          title: 'Checklist',
          icon: ICON_URL,

          content: {
            type: 'iframe',
            url: t.signUrl(TASKS_URL),
            height: 560
          }
        };
      }
    });
  </script>
</body>
</html>
