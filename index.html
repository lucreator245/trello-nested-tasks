<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checklist</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const TASKS_URL =
      'https://lucreator245.github.io/trello-nested-tasks/tasks.html';

    const ICON_URL =
      'https://lucreator245.github.io/trello-nested-tasks/icon.svg';

    const BADGE_ICON_URL =
      'https://lucreator245.github.io/trello-nested-tasks/checklist-badge.svg';

    const STORAGE_KEY = 'nested-tasks';

    function getTaskData(data) {
      const tasks =
        data &&
        Array.isArray(data.tasks)
          ? data.tasks
          : [];

      const mainTasks = tasks.filter(
        task => task.parentId === null
      );

      const completedMainTasks = mainTasks.filter(
        task => task.completed
      ).length;

      const completedAllTasks = tasks.filter(
        task => task.completed
      ).length;

      return {
        mainTotal: mainTasks.length,
        mainCompleted: completedMainTasks,
        total: tasks.length,
        completed: completedAllTasks
      };
    }

    window.TrelloPowerUp.initialize({
      'card-buttons': function (t) {
        return [{
          text: 'Checklist',
          icon: ICON_URL,

          callback: function () {
            return t.popup({
              title: 'Checklist',
              url: TASKS_URL,
              height: 560
            });
          }
        }];
      },

      'card-badges': function (t) {
        return t.get(
          'card',
          'private',
          STORAGE_KEY
        ).then(function (data) {
          const progress = getTaskData(data);

          if (progress.total === 0) {
            return [];
          }

          const allTasksComplete =
            progress.completed === progress.total;

          return [{
            icon: BADGE_ICON_URL,

            text:
              `${progress.mainCompleted}/${progress.mainTotal}`,

            color:
              allTasksComplete
                ? 'green'
                : 'blue',

            refresh: 5
          }];
        }).catch(function (error) {
          console.error(
            'Could not load Checklist badge:',
            error
          );

          return [];
        });
      },

      'card-back-section': function (t) {
        return {
          title: 'Checklist',
          icon: ICON_URL,

          content: {
            type: 'iframe',
            url: t.signUrl(TASKS_URL),
            height: 560
          }
        };
      }
    });
  </script>
</body>
</html>
